<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KevinSoft - Acceso</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nuestro CSS separado -->
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            
            <div class="text-center mb-4">
                <h2 class="brand-title">KevinSoft</h2>
                <p class="brand-subtitle">Sistema Táctico de Control</p>
                <div class="brand-slogan">Precisión en el Código, Certeza en el Blanco</div>
            </div>

            <form id="formLogin">
                <div class="mb-3">
                    <label for="cedula" class="form-label">Cédula de Identidad</label>
                    <input type="text" class="form-control" id="cedula" placeholder="Ej: 0912345678" required autocomplete="username">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                
                <button type="submit" id="btnSubmit" class="w-100 btn-login">INICIAR SESIÓN</button>
            </form>

            <div id="mensaje_alerta" class="alert-message" role="status" aria-live="polite"></div>
            
        </div>
    </div>

    <!-- Nuestro JS separado -->
    <script src="js/app.js"></script>
</body>
</html>
